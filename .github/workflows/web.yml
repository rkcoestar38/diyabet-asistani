name: Web (GitHub Pages)

# main'e her gönderimde web sürümü derlenir ve https://<kullanıcı>.github.io/diyabet-asistani/ adresinde yayınlanır.
# iPhone'da Safari ile açılıp "Ana Ekrana Ekle" ile uygulama gibi kullanılır; veriler cihazda kalır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Web sürümünü derle
        env:
          BASE: /diyabet-asistani
          EXPO_BASE_URL: /diyabet-asistani
        run: |
          node -e "
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          a.expo.experiments.baseUrl = process.env.BASE;
          fs.writeFileSync('app.json', JSON.stringify(a, null, 2));
          "
          npx expo export --platform web
          node scripts/web-postbuild.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
